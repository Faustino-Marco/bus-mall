<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BusMall — vote on quirky bus-ride products and see what fellow passengers prefer.">
  <title>Bus Mall</title>
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js" defer></script>
</head>
<body>
  <header>
    <h1>Bus Mall</h1>
    <p>Which product would you buy on your commute?</p>
  </header>
  <main>
    <section id="products">
      <ul>
        <li><button class="product-btn"><img id="imgOne" src="" alt=""></button></li>
        <li><button class="product-btn"><img id="imgTwo" src="" alt=""></button></li>
        <li><button class="product-btn"><img id="imgThree" src="" alt=""></button></li>
      </ul>
    </section>

    <p id="instructions">Click your favorite to vote &mdash; <span id="votes-remaining">25</span> votes remaining.</p>

    <div id="chart-container" hidden>
      <h2>Results: Votes &amp; Views</h2>
      <canvas id="myChart"
        aria-label="Bar chart showing votes and views per product" role="img"></canvas>
    </div>
  </main>
  <footer>
    <p>&copy; 2024 Bus Mall</p>
  </footer>

  <script src="js/bus-mall.js" defer></script>
</body>
</html>
